    menuCollectEffects = [];

    menuPlayerX =
        width / 2;

    menuPlayerY =
        height * 0.70;

    menuPlayerTargetX =
        width / 2;

    menuTime = 0;

    menuLastFrame =
        performance.now();


    if (!menuAnimation) {

        menuAnimation =
            requestAnimationFrame(
                menuLoop
            );
    }
}


/* ===================================
   HOME WITH AD
=================================== */

/*
    Эта функция используется только для двух
    кнопок "ДОМОЙ":

    1. ДОМОЙ на экране проигрыша.
    2. ДОМОЙ в меню паузы.

    Сначала вызывается обычная fullscreen-реклама,
    затем после её закрытия выполняется goHome().
*/

function goHomeWithAd() {

    /*
        Не даём пользователю случайно запустить
        несколько переходов домой подряд.
    */

    if (
        goHomeWithAd.busy
    ) {

        return;
    }


    goHomeWithAd.busy = true;


    showFullscreenAdAndThen(
        function() {

            goHomeWithAd.busy = false;

            goHome();
        }
    );
}


/* ===================================
   GAME OVER
=================================== */

function finishGame() {

    if (!playing) {
        return;
    }


    playing = false;

    paused = false;

    externalPause = false;

    countdownActive = false;

    countdownToken++;

    clearCountdownTimer();

    pauseScreen.classList.add(
        "hidden"
    );

    game.classList.remove(
        "countdown-active"
    );


    finalScore.textContent =
        score;


    const isNewRecord =
        score > best;


    if (isNewRecord) {

        best = score;

        void saveCloudBest(best);
    }


    bestElement.textContent =
        best;

    menuBest.textContent =
        best;


    gameOverHint.classList.remove(
        "new-record"
    );


    if (isNewRecord) {

        gameOverHint.textContent =
            "Новый рекорд!";

        gameOverHint.classList.add(
            "new-record"
        );

    } else {

        gameOverHint.textContent =
            "Попробуй побить рекорд!";
    }


    createExplosion(
        playerX,
        playerY
    );


    draw();


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* ===================================
   CHANGE DIRECTION
=================================== */

function turn() {

    if (
        !playing ||
        paused
    ) {
        return;
    }


    /*
        Во время countdown направление
        также не меняем.
    */

    if (
        countdownActive
    ) {

        return;
    }


    direction *= -1;


    for(let i = 0; i < 5; i++) {

        particles.push({

            x: playerX,

            y: playerY,

            vx:
                (Math.random() - .5) * 3,

            vy:
                (Math.random() - .5) * 3,

            life: 1,

            color: "#6ee7ff"
        });
    }


    particles.push({

        x: playerX,

        y: playerY,

        vx:
            (Math.random() - .5) * 3,

        vy:
            (Math.random() - .5) * 3,

        life: 1,

        color: "#6ee7ff"
    });
}


/* ===================================
   CREATE WALL
=================================== */

function createWall() {

    const gap =
        Math.max(
            135,
            200 -
            gameTime * 0.006
        );

    const margin = 25;


    let center;


    if (walls.length === 0) {

        center =
            width / 2;

    } else {

        const previous =
            walls[walls.length - 1];


        const previousCenter =
            previous.currentCenterX !== undefined
                ? previous.currentCenterX
                : (
                    previous.left +
                    previous.right
                ) / 2;


        if (
            typeof window.wallDirection ===
            "undefined"
        ) {

            window.wallDirection =
                Math.random() < 0.5
                    ? -1
                    : 1;
        }


        if (
            Math.random() < 0.18
        ) {

            window.wallDirection *= -1;
        }


        const maxShift =
            Math.min(
                75,
                45 +
                gameTime * 0.02
            );


        const shift =
            (
                0.65 +
                Math.random() * 0.35
            ) *
            maxShift *
            window.wallDirection;


        center =
            previousCenter +
            shift;


        const minCenter =
            margin +
            gap / 2;

        const maxCenter =
            width -
            margin -
            gap / 2;


        if (
            center <= minCenter
        ) {

            center =
                minCenter;

            window.wallDirection =
                1;
        }


        if (
            center >= maxCenter
        ) {

            center =
                maxCenter;

            window.wallDirection =
                -1;
        }
    }


    const moving =
        Math.random() < 0.30;


    const moveAmplitude =
        moving
            ? 12 +
              Math.random() * 18
            : 0;


    const moveFrequency =
        moving
            ? 0.0012 +
              Math.random() * 0.001
            : 0;


    const movePhase =
        Math.random() *
        Math.PI *
        2;


    const wall = {

        y: -35,

        height: 30,

        centerX:
            center,

        currentCenterX:
            center,

        gap:
            gap,

        left:
            center -
            gap / 2,

        right:
            center +
            gap / 2,

        moving:
            moving,

        moveAmplitude:
            moveAmplitude,

        moveFrequency:
            moveFrequency,

        movePhase:
            movePhase,

        passed:
            false
    };


    walls.push(wall);


    if (Math.random() < 0.75) {

        const random =
            Math.random();

        let type;


        if (random < 0.70) {

            type = "normal";

        } else if (random < 0.95) {

            type = "rare";

        } else {

            type = "super";
        }


        diamonds.push({

            x:
                wall.left +
                25 +
                Math.random() *
                Math.max(
                    1,
                    gap - 50
                ),

            y:
                wall.y +
                wall.height / 2,

            size:
                type === "super"
                    ? 12
                    : type === "rare"
                        ? 10
                        : 9,

            rotation:
                Math.random(),

            type:
                type
        });
    }
}


/* ===================================
   COLLISION
=================================== */

function collision(
    px,
    py,
    radius,
    x,
    y,
    w,
    h
) {

    if (
        w <= 0 ||
        h <= 0
    ) {
        return false;
    }


    const closestX =
        Math.max(
            x,
            Math.min(
                px,
                x + w
            )
        );


    const closestY =
        Math.max(
            y,
            Math.min(
                py,
                y + h
            )
        );


    const dx =
        px - closestX;

    const dy =
        py - closestY;


    return (
        dx * dx +
        dy * dy <
        radius * radius
    );
}


/* ===================================
   UPDATE
=================================== */

function update(delta) {

    delta =
        Math.min(
            delta,
            40
        );


    const frame =
        delta / 16.666;


    playerCollectPulse =
        Math.max(
            0,
            playerCollectPulse -
            0.055 * frame
        );


    if (
        countdownActive ||
        paused
    ) {
        return;
    }


    gameTime += delta;

    continueBoost =
        Math.max(
            0,
            continueBoost - delta
        );


    safeTime =
        Math.max(
            0,
            safeTime - delta
        );


    /* ===================================
       PLAYER SPEED / DISTANCE
    =================================== */

    distanceTravelled +=
        playerSpeed *
        frame *
        0.60;


    while (
        distanceTravelled >=
        nextSpeedMilestone
    ) {

        nextSpeedMilestone += 75;


        playerSpeed =
            Math.min(
                MAX_PLAYER_SPEED,
                playerSpeed +
                SPEED_INCREASE_PER_100M
            );
    }


    const distanceSpeedBonus =
        Math.min(
            0.9,
            distanceTravelled *
            0.00018
        );


    const targetPlayerSpeed =
        Math.min(
            MAX_PLAYER_SPEED,
            2.7 +
            distanceSpeedBonus +
            Math.floor(
                distanceTravelled / 100
            ) *
            SPEED_INCREASE_PER_100M
        );


    playerSpeed +=
        (
            targetPlayerSpeed -
            playerSpeed
        ) *
        0.015 *
        frame;


    playerSpeed =
        Math.min(
            MAX_PLAYER_SPEED,
            playerSpeed
        );


    /* ================================
       PLAYER
    ================================= */

    playerX +=
        direction *
        playerSpeed *
        frame;


    if (
        playerX < 18
    ) {

        playerX = 18;

        direction = 1;
    }


    if (
        playerX >
        width - 18
    ) {

        playerX =
            width - 18;

        direction = -1;
    }


    playerY =
        height * 0.72 +
        Math.sin(
            gameTime * 0.004
        ) * 18;


    /* ================================
       WALL SPAWN
    ================================= */

    wallTimer -= delta;


    if (
        wallTimer <= 0
    ) {

        createWall();


        wallTimer =
            Math.max(
                850,
                1500 -
                gameTime * 0.025
            );
    }


    /* ================================
       WALL SPEED
    ================================= */

    let wallSpeed =
        Math.min(
            4.2,
            2.0 +
            distanceTravelled * 0.00075
        );


    if (continueBoost > 0) {

        const progress =
            1 -
            continueBoost / 3000;


        const smooth =
            progress *
            progress;


        wallSpeed *=
            0.35 +
            smooth * 0.65;
    }


    /* ================================
       WALLS
    ================================= */

    for(
        let i =
            walls.length - 1;

        i >= 0;

        i--
    ) {

        const wall =
            walls[i];


        wall.y +=
            wallSpeed *
            frame;


        if (wall.moving) {

            const offset =
                Math.sin(
                    gameTime *
                    wall.moveFrequency +
                    wall.movePhase
                ) *
                wall.moveAmplitude;


            wall.currentCenterX =
                wall.centerX +
                offset;


            const minCenter =
                25 +
                wall.gap / 2;

            const maxCenter =
                width -
                25 -
                wall.gap / 2;


            wall.currentCenterX =
                Math.max(
                    minCenter,
                    Math.min(
                        maxCenter,
                        wall.currentCenterX
                    )
                );


            wall.left =
                wall.currentCenterX -
                wall.gap / 2;

            wall.right =
                wall.currentCenterX +
                wall.gap / 2;
        }


        const nearPlayer =
            wall.y <
            playerY + 30 &&
            wall.y +
            wall.height >
            playerY - 30;


        if (
            safeTime <= 0 &&
            nearPlayer
        ) {

            const hitLeft =
                collision(
                    playerX,
                    playerY,
                    10,

                    0,
                    wall.y,

                    wall.left,
                    wall.height
                );


            const hitRight =
                collision(
                    playerX,
                    playerY,
                    10,

                    wall.right,
                    wall.y,

                    width -
                    wall.right,
                    wall.height
                );


            if (
                hitLeft ||
                hitRight
            ) {

                finishGame();

                return;
            }
        }


        if (
            !wall.passed &&
            wall.y >
            playerY
        ) {

            wall.passed = true;

            score++;

            scoreElement.textContent =
                score;


            if (
                score % 5 === 0
            ) {

                showCombo(
                    "🔥 " +
                    score
                );
            }
        }


        if (
            wall.y >
            height + 80
        ) {

            walls.splice(
                i,
                1
            );
        }
    }


    /* ================================
       DIAMONDS
    ================================= */

    for(
        let i =
            diamonds.length - 1;

        i >= 0;

        i--
    ) {

        const d =
            diamonds[i];


        d.y +=
            wallSpeed *
            frame;


        d.rotation +=
            0.05 *
            frame;


        const dx =
            playerX -
            d.x;

        const dy =
            playerY -
            d.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance <
            20
        ) {

            let reward = 5;

            let text = "+5 💎";


            if (
                d.type === "rare"
            ) {

                reward = 15;

                text = "+15 💜";

            } else if (
                d.type === "super"
            ) {

                reward = 30;

                text = "+30 🔥";
            }


            score += reward;


            scoreElement.textContent =
                score;


            showCombo(
                text
            );


            createCrystalCollectEffect(
                d.x,
                d.y,
                d.type
            );


            diamonds.splice(
                i,
                1
            );


            continue;
        }


        if (
            d.y >
            height + 50
        ) {

            diamonds.splice(
                i,
                1
            );
        }
    }


    /* ================================
       PARTICLES
    ================================= */

    for(
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx *
            frame;

        p.y +=
            p.vy *
            frame;


        p.vy +=
            0.12 *
            frame;


        p.life -=
            0.035 *
            frame;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* ===================================
   COMBO
=================================== */

function showCombo(text) {

    combo.textContent =
        text;


    combo.classList.add(
        "show"
    );


    clearTimeout(
        combo.timer
    );


    combo.timer =
        setTimeout(
            () => {

                combo.classList.remove(
                    "show"
                );

            },
            700
        );
}


/* ===================================
   EXPLOSION
=================================== */

function createExplosion(
    x,
    y,
    type = "normal"
) {

    let color =
        "#6ee7ff";


    if (
        type === "rare"
    ) {

        color =
            "#c77dff";

    } else if (
        type === "super"
    ) {

        color =
            "#ff9f43";
    }


    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const velocity =
            1 +
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                velocity,

            vy:
                Math.sin(angle) *
                velocity,

            life: 1,

            color: color
        });
    }
}


function createCrystalCollectEffect(
    x,
    y,
    type = "normal"
) {

    playerCollectPulse = 1;


    let color = "#6ee7ff";


    if (type === "rare") {
        color = "#c77dff";
    }

    if (type === "super") {
        color = "#ff9f43";
    }


    particles.push({

        x: x,

        y: y,

        vx: 0,

        vy: 0,

        life: 1,

        color: color,

        ring: true,

        size: 8
    });


    for (let i = 0; i < 16; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            2 +
            Math.random() * 3.5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            color: color
        });
    }
}


/* ===================================
   DRAW BACKGROUND
=================================== */

function drawBackground() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    gradient.addColorStop(
        0,
        "#101b4d"
    );

    gradient.addColorStop(
        0.45,
        "#0b1232"
    );

    gradient.addColorStop(
        1,
        "#030611"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const glow =
        ctx.createRadialGradient(
            width / 2,
            height * 0.18,
            0,
            width / 2,
            height * 0.18,
            width * 0.8
        );


    glow.addColorStop(
        0,
        "rgba(75,110,255,.20)"
    );

    glow.addColorStop(
        0.45,
        "rgba(60,80,220,.08)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.strokeStyle =
        "rgba(100,180,255,.055)";

    ctx.lineWidth = 1;


    const offset =
        (gameTime * 0.035) % 45;


    for (
        let x = -45;
        x < width + 45;
        x += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }


    for (
        let y = -45 + offset;
        y < height + 45;
        y += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }


    ctx.fillStyle =
        "rgba(150,210,255,.35)";


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const x =
            (i * 83) % width;


        const y =
            (
                i * 137 +
                gameTime *
                (
                    0.01 +
                    (i % 3) *
                    0.005
                )
            ) % height;


        const size =
            i % 4 === 0
                ? 1.5
                : 0.8;


        ctx.globalAlpha =
            0.25 +
            Math.sin(
                gameTime * 0.002 +
                i
            ) * 0.15;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.globalAlpha = 1;
}


/* ===================================
   DRAW WALLS
=================================== */

function drawWalls() {

    for (
        const wall of walls
    ) {

        const top =
            wall.y;

        const bottom =
            wall.y +
            wall.height;


        const gradient =
            ctx.createLinearGradient(
                0,
                top,
                0,
                bottom
            );


        gradient.addColorStop(
            0,
            "#ff5c8a"
        );

        gradient.addColorStop(
            0.45,
            "#ff315f"
        );

        gradient.addColorStop(
            1,
            "#a51fff"
        );


        ctx.fillStyle =
            gradient;


        ctx.shadowColor =
            "#ff3d81";

        ctx.shadowBlur =
            wall.moving
                ? 24
                : 20;


        ctx.fillRect(
            0,
            top,
            Math.max(
                0,
                wall.left
            ),
            wall.height
        );


        ctx.fillRect(
            wall.right,
            top,
            Math.max(
                0,
                width -
                wall.right
            ),
            wall.height
        );


        ctx.shadowBlur = 0;


        ctx.fillStyle =
            "rgba(255,255,255,.30)";


        ctx.fillRect(
            0,
            top,
            Math.max(
                0,
                wall.left
            ),
            2
        );


        ctx.fillRect(
            wall.right,
            top,
            Math.max(
                0,
                width -
                wall.right
            ),
            2
        );


        ctx.fillStyle =
            "rgba(40,0,70,.20)";


        ctx.fillRect(
            0,
            bottom - 4,
            Math.max(
                0,
                wall.left
            ),
            4
        );


        ctx.fillRect(
            wall.right,
            bottom - 4,
            Math.max(
                0,
                width -
                wall.right
            ),
            4
        );


        if (wall.moving) {

            ctx.fillStyle =
                "rgba(255,255,255,.10)";


            ctx.fillRect(
                0,
                top + 4,
                Math.max(
                    0,
                    wall.left
                ),
                1
            );


            ctx.fillRect(
                wall.right,
                top + 4,
                Math.max(
                    0,
                    width -
                    wall.right
                ),
                1
            );
        }
    }
}


/* ===================================
   DRAW DIAMONDS
=================================== */

function drawDiamonds() {

    for (
        const d of diamonds
    ) {

        ctx.save();


        ctx.translate(
            d.x,
            d.y
        );


        ctx.rotate(
            d.rotation
        );


        let color;

        let glow;


        if (
            d.type === "super"
        ) {

            color = "#ff9f43";

            glow = "#ff6b00";

        } else if (
            d.type === "rare"
        ) {

            color = "#c77dff";

            glow = "#9d4edd";

        } else {

            color = "#6ee7ff";

            glow = "#00c8ff";
        }


        ctx.shadowColor =
            glow;


        ctx.shadowBlur =
            d.type === "super"
                ? 35
                : 25;


        ctx.fillStyle =
            color;


        ctx.beginPath();

        ctx.moveTo(
            0,
            -d.size - 2
        );

        ctx.lineTo(
            d.size + 2,
            0
        );

        ctx.lineTo(
            0,
            d.size + 2
        );

        ctx.lineTo(
            -d.size - 2,
            0
        );

        ctx.closePath();

        ctx.fill();


        ctx.shadowBlur = 0;


        ctx.fillStyle =
            "rgba(255,255,255,.35)";


        ctx.beginPath();

        ctx.moveTo(
            0,
            -d.size
        );

        ctx.lineTo(
            d.size * .45,
            0
        );

        ctx.lineTo(
            0,
            d.size * .2
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            "rgba(255,255,255,.9)";


        ctx.beginPath();

        ctx.arc(
            -d.size * .25,
            -d.size * .25,
            1.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();
    }
}


/* ===================================
   DRAW PLAYER
=================================== */

function drawPlayer() {

    ctx.save();


    const pulse =
        Math.sin(
            gameTime * 0.008
        ) * 1.5;


    const collectScale =
        playerCollectPulse *
        7;


    const radius =
        11 +
        pulse +
        collectScale;


    ctx.shadowColor =
        "#38e8ff";

    ctx.shadowBlur =
        30;


    ctx.fillStyle =
        "rgba(70,220,255,.12)";


    ctx.beginPath();

    ctx.arc(
        playerX,
        playerY,
        radius + 9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    const gradient =
        ctx.createRadialGradient(
            playerX - 4,
            playerY - 5,
            1,

            playerX,
            playerY,
            radius
        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.25,
        "#d8fbff"
    );

    gradient.addColorStop(
        0.55,
        "#52eaff"
    );

    gradient.addColorStop(
        1,
        "#3867ff"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        playerX,
        playerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.beginPath();

    ctx.arc(
        playerX - 4,
        playerY - 5,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


/* ===================================
   DRAW PARTICLES
=================================== */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );


        if (p.ring) {

            const radius =
                p.size +
                (1 - p.life) * 38;


            ctx.strokeStyle =
                p.color;

            ctx.lineWidth =
                2.5 *
                p.life;


            ctx.shadowColor =
                p.color;

            ctx.shadowBlur =
                18;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();


            ctx.fillStyle =
                p.color;

            ctx.globalAlpha =
                p.life * .12;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                radius * .65,
                0,
                Math.PI * 2
            );

            ctx.fill();


            continue;
        }


        ctx.fillStyle =
            p.color ||
            "#6ee7ff";

        ctx.shadowColor =
            p.color ||
            "#6ee7ff";

        ctx.shadowBlur =
            8;


        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            1.5 +
            p.life * 3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.shadowBlur = 0;

    ctx.globalAlpha = 1;
}


/* ===================================
   DRAW
=================================== */

function draw() {

    drawBackground();

    drawWalls();

    drawDiamonds();


    if (!countdownActive) {

        drawParticles();
    }


    if (
        playerX !== null
    ) {

        drawPlayer();
    }
}


/* ===================================
   GAME LOOP
=================================== */

function loop(timestamp) {

    if (!playing) {

        draw();

        return;
    }


    if (paused) {

        draw();

        animation = 0;

        return;
    }


    const delta =
        timestamp -
        lastFrame;


    lastFrame =
        timestamp;


    update(delta);

    draw();


    if (
        playing &&
        !paused
    ) {

        animation =
            requestAnimationFrame(
                loop
            );
    }
}


/* ===================================
   INPUT
=================================== */

game.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target.closest("button")
        ) {

            return;
        }


        if (
            event.pointerType === "touch" ||
            event.pointerType === "pen"
        ) {

            turn();
        }
    }
);


/* ===================================
   BUTTONS
=================================== */

document
    .getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


/*
    Теперь кнопка "ПРОДОЛЖИТЬ" сначала
    запускает Rewarded-рекламу.

    Продолжение игры происходит только после
    получения награды.
*/

document
    .getElementById("continue")
    .addEventListener(
        "click",
        continueWithRewardedAd
    );


/*
    ВАЖНО:

    Было:
        goHome

    Стало:
        goHomeWithAd

    Поэтому обычная fullscreen-реклама
    показывается перед возвращением домой.
*/

document
    .getElementById("home")
    .addEventListener(
        "click",
        goHomeWithAd
    );


/* ===================================
   PAUSE BUTTONS
=================================== */

pauseButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        /*
            Во время обратного отсчёта
            пауза недоступна.
        */

        if (
            countdownActive
        ) {

            return;
        }

        pauseGame("manual");
    }
);


pauseResumeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        resumeGame();
    }
);


/*
    ВАЖНО:

    Кнопка ДОМОЙ в меню паузы также
    использует fullscreen-рекламу.
*/

pauseHomeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        goHomeWithAd();
    }
);


/* ===================================
   INITIALIZATION
=================================== */

resetGame();

draw();

game.classList.add(
    "menu-active"
);

menuLastFrame =
    performance.now();

menuAnimation =
    requestAnimationFrame(
        menuLoop
    );
	
	initVKSDK();
	loadCloudBest();

</script>
